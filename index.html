          <h1>S40 Fietsservice Nijkerk, road bike specialist</h1>
          <p>Workshop and shop for road bikes, gravel bikes, BMX, track bikes and triathlon bikes at Singel 40 in Nijkerk, the Netherlands.</p>
          <h2>Every bike. Every discipline.</h2>
          <p>From road bikes to track bikes, from gravel to triathlon. We know what your sport demands because we live it ourselves. Mountain bikes are welcome too.</p>
          <ul>
            <li><h3>Road bike</h3><p>Maintenance, repair and set-up of your road bike. We do not stop when it shifts, but when it works perfectly in every position.</p></li>
            <li><h3>Gravel</h3><p>Maintenance and repair for your gravel bike, so it is ready for any surface.</p></li>
            <li><h3>BMX</h3><p>Race BMX bikes serviced and set up, brakes included.</p></li>
            <li><h3>Track bike</h3><p>Maintenance and set-up of track bikes for training and racing.</p></li>
            <li><h3>Triathlon and time trial</h3><p>Time trial and triathlon bikes positioned and set up, to UCI rules where required.</p></li>
            <li><h3>Bike fit and set-up</h3><p>Set up for your body and your goals, so you ride without discomfort or pain in the saddle.</p></li>
            <li><h3>Custom build</h3><p>A new or second-hand bike specified and built to your wishes, with advice on the purchase.</p></li>
          </ul>
          <p>Prices on request. Every bike and every job is different. Tell us what you ride and what needs to happen.</p>
          <ul><li>Maintenance and repair, all work</li><li>Race preparation</li><li>Parts and accessories</li><li>Bike sales, custom builds too</li></ul>
          <p>Dealer of YOONIT, CyclOn, Izumi chains.</p>
          <h2>Cyclists who help cyclists</h2>
          <p>S40 Fietsservice is not an ordinary bike shop. Cyclists stand behind our workbench: people who race themselves and know what is at stake when a bike is not right.</p>
          <p>S40 stands for Singel 40, the address of our workshop in Nijkerk. We have more than twenty years of experience in Europe, from amateur to professional, as a mechanic and as a racer. We worked as a mechanic in UCI teams and prepare bikes to UCI rules.</p>
          <p>Our workshop is a boutique and a meeting place for the racing community. Feel free to walk in, even if you only want to look around or ask something.</p>
          <ul><li>20+ years of experience in Europe</li><li>UCI certified, experience as team mechanic</li><li>24 h usual turnaround</li></ul>
          <h3>Why S40 Fietsservice</h3>
          <ol><li><strong>Done when it works perfectly</strong> We do not stop when the gears shift, but when they work perfectly in every position.</li><li><strong>The jobs others turn down</strong> A problem other workshops could not solve? We take it on. The time we spend investigating and looking for the best solution is not charged.</li><li><strong>From amateur to pro</strong> More than twenty years of experience in Europe as a mechanic and as a racer, with UCI certification and experience in UCI teams.</li><li><strong>Usually ready within 24 hours</strong> The usual turnaround is 24 hours. With a difficult problem we take the time to do it right.</li></ol>
          <h3>The team</h3>
          <ul><li>Wojciech Kreński, Owner and mechanic (Speaks: English, Polish)</li><li>Jaroslaw Oworuszko, Owner</li><li>Michiel Frederiks, Shop assistant (Speaks: Dutch, English)</li></ul>
          <h2>Frequently asked questions</h2>
          <h3>Which bike shop in Nijkerk specialises in road bikes?</h3>
          <p>S40 Fietsservice at Singel 40 in Nijkerk is a workshop and shop for performance bikes, with the road bike at its core. The team are cyclists who race themselves and have worked as mechanics in UCI teams, with more than twenty years of experience in Europe. You can go there for maintenance, repair, set-up and bike fit, for getting your bike ready for a race and for having a custom bike built. The workshop is open Tuesday to Friday from 10:00 to 18:00 and on Saturday from 10:00 to 16:00. You can walk in without an appointment or book one first.</p>
          <h3>Where can I get my gravel bike serviced or repaired in Nijkerk?</h3>
          <p>At S40 Fietsservice, Singel 40 in Nijkerk. The workshop services and repairs gravel bikes, alongside road bikes, track bikes, BMX bikes and triathlon bikes. Mountain bikes are welcome too. The mechanics are cyclists themselves and look beyond the job you name. The usual turnaround is 24 hours, but with a difficult problem they take the time to solve it properly. Walk in during opening hours or book ahead at service@s40.nl or by phone on +31 6 26980438. Prices are on request, because every bike and every job is different.</p>
          <h3>What is a bike fit and where can I get one near Nijkerk?</h3>
          <p>A bike fit is the process of setting up your bike for your body, your way of riding and your goals, so you ride comfortably, efficiently and without pain or discomfort. It covers things such as the position of the saddle, handlebars and pedals. At S40 Fietsservice, Singel 40 in Nijkerk, you can get a set-up and bike fit, on your own bike or on a new or second-hand bike they build for you. The mechanics are cyclists themselves and aim for a bike that works well in every position. Book an appointment at service@s40.nl, call +31 6 26980438 or walk in.</p>
          <h3>Is there a bike mechanic in Nijkerk with experience in UCI teams?</h3>
          <p>Yes. At S40 Fietsservice in Nijkerk, the people have more than twenty years of experience in Europe, from amateur to professional, as mechanics and as racers. That includes experience as a mechanic in UCI teams, and UCI certification. It means they know what it takes to prepare a bike for a race to UCI rules, and they give the same care to the bike of a recreational rider. You will find the workshop at Singel 40, 3861 AE Nijkerk. You can drop by or get in touch first at service@s40.nl or +31 6 26980438.</p>
          <h3>I need a bike shop near Nijkerk for my track bike or time trial bike: who can help?</h3>
          <p>S40 Fietsservice at Singel 40 in Nijkerk works on track bikes, time trial bikes and triathlon bikes, alongside road bikes and gravel bikes. For time trial and triathlon bikes they position and set up the bike, to UCI rules if your race requires it. For a track bike you can go there for maintenance and set-up. The mechanics have experience in UCI teams and ride themselves. Get in touch at service@s40.nl or +31 6 26980438, or walk in during opening hours: Tuesday to Friday 10:00 to 18:00, Saturday 10:00 to 16:00.</p>
          <h3>I have a race coming up: where can I get my road bike checked and prepared near Nijkerk?</h3>
          <p>At S40 Fietsservice, Singel 40 in Nijkerk. Race preparation is one of the services: the bike is checked and set up, to UCI rules if your race asks for it. The mechanics have worked in UCI teams and know the pressure around a start line. The usual turnaround is 24 hours, but anyone who wants to be sure of good preparation should not plan at the last moment. Book in good time at service@s40.nl or call +31 6 26980438. If it is urgent, do call: they will see what is possible.</p>
          <h3>My bike has a problem other workshops could not fix: which bike mechanic near Nijkerk takes on difficult jobs?</h3>
          <p>S40 Fietsservice in Nijkerk also takes on jobs that other workshops turn down or cannot solve. S40 does not charge the customer for the investigation and the search for the best solution: the team sees such a job as a chance to grow as craftspeople. In Google reviews, customers write that the owner found a problem they had not even thought of, and that a problem other shops could not solve was repaired straight away and fast. You will find the workshop at Singel 40, 3861 AE Nijkerk. Describe your problem at service@s40.nl or call +31 6 26980438.</p>
          <h3>How do I know if my road bike is properly set up for my body, and when do I need a bike fit?</h3>
          <p>A well set-up bike feels right without effort: you sit relaxed, can hold your position for a long time and have no pain or discomfort during or after riding. Complaints in the knees, back, neck, shoulders or wrists, numb hands or feet, or constantly sliding forward on your saddle can suggest the set-up is not right. A bike fit also makes sense with a new or second-hand bike, after a change in your body or your goals, or when you prepare for a race or a long ride. If complaints persist, also consult a doctor or physiotherapist. At S40 Fietsservice in Nijkerk you can get a set-up and bike fit.</p>
          <h3>How do I get a custom bike built, new or used, and what can I prepare beforehand?</h3>
          <p>At S40 Fietsservice in Nijkerk they build bikes, new or second-hand, to your wishes. Think beforehand about what you use the bike for (training, racing, long rides or gravel), what budget you have, what you like and dislike about your current bike and which parts you want to keep. Bring your current bike or parts if you want to reuse them, and a list or photos of what you are looking for. The team gives advice on the purchase and then sets the bike up for your body. Prices are on request. Book an appointment at service@s40.nl or call +31 6 26980438.</p>
          <h3>How do I book an appointment with a road bike specialist in Nijkerk, and what are the opening hours?</h3>
          <p>You book an appointment at S40 Fietsservice by emailing service@s40.nl, calling +31 6 26980438 or filling in the form on this website, which prepares an email for you. You can also walk in without an appointment. The workshop is at Singel 40, 3861 AE Nijkerk and is open Tuesday to Friday from 10:00 to 18:00 and on Saturday from 10:00 to 16:00. We are closed on Sunday and Monday. You can also reach us on Instagram (@s40service).</p>
          <h2>Riding from Nijkerk</h2>
          <p>Four road routes starting and finishing in Nijkerk. See the route, the elevation profile and download the GPX file for your bike computer. Gravel routes will follow.</p>
          <ul>
            <li><h3>Wolderwijd and Zeewolde</h3><p>Flat loop along the Wolderwijd, Zeewolde and Harderwijk. 48.0 km, Elevation gain (estimate): 73 m. <a href="/routes/route-1-48km.gpx">Download GPX</a></p></li>

            <li><h3>Veluwe and Kootwijk</h3><p>Long route via Putten, Garderen, Kootwijk, Ede and Barneveld. 97.4 km, Elevation gain (estimate): 314 m. <a href="/routes/route-3-98km.gpx">Download GPX</a></p></li>

          </ul>
          <h2>Watch the racing on the big screen</h2>
          <p>For the big races you can watch with us: the Grand Tours, the Classics and cyclo-cross in winter. You are always welcome to follow them on the big screen in the shop, during normal opening hours.</p>
          <ul><li>Grand Tours: Stage after stage on the big screen.</li><li>Classics: Watch the spring and autumn Classics together.</li><li>Cyclo-cross in winter: Follow the cyclo-cross season in the workshop.</li></ul>
          <p>We announce special openings on Instagram. <a href="https://www.instagram.com/s40service/">@s40service</a></p>
          <h2>Book an appointment</h2>
          <p>You can walk in without an appointment, but booking helps for a bigger job or a bike fit. Fill in the form: your email app opens with a ready-made message to us.</p>

      <p>The Micro Utility Bike goes smaller still. YOONIT calls it the tiniest bike with big cargo vibes, with interchangeable crates and baskets. The PRO Business Bike is aimed at trades, craft businesses and community projects.</p>

      <h4>Electric drive is an option</h4>

      <h4>See and ride them in Nijkerk</h4>
      <p>At S40 Fietsservice you can look at several YOONIT models and try them. S40 is a workshop of cyclists for cyclists, and the care that goes into setting up a race bike goes into the bike you ride every day too. To see what else we do, read <a href="/post/road-bike-specialist-nijkerk.html">where to go in Nijkerk as a road cyclist</a>.</p>

    <article>
      <h3><a href="/post/bike-fit-nijkerk.html">What is a bike fit and where can you get one near Nijkerk?</a></h3>
      <time datetime="2026-11-03">3 November 2026</time>
      <p><em>A bike fit sets your bike up for your body, your way of riding and your goals. Read what it is, when it makes sense, what to prepare and where to go near Nijkerk.</em></p>
      <p>Two cyclists on the same frame never sit exactly the same. Differences in height, flexibility, riding style and goals mean a bike that feels perfect for one rider causes pain or discomfort for another. A bike fit solves that by adapting the bike to you, rather than the other way around.</p>
      <h4>What is a bike fit?</h4>
      <p>A bike fit, also called a set-up, is the process of adjusting your bike to your body, your way of riding and your goals. The aim is to ride comfortably, efficiently and without pain or discomfort. It covers, among other things, the places where you touch the bike: the saddle, the handlebars and the pedals.</p>
      <h4>When do you need a bike fit?</h4>
      <p>Your bike is probably not set up well if you have pain or discomfort in your knees, back, neck, shoulders or wrists during or after riding, if your hands or feet go numb, or if you keep sliding forward on your saddle. A bike fit also makes sense with a new or second-hand bike, after a long break or when your body or goals change, and when you prepare for a race or a long ride. If complaints persist, also consult a doctor or physiotherapist.</p>
      <h4>If you are buying a new or second-hand bike</h4>
      <p>When buying a bike, people often look at size and price. But a frame size on paper says little about how the bike fits your body. If you are considering a new or second-hand bike, you benefit most from someone who looks at the position and the parts that go with it, before you ride many kilometres on it.</p>
      <p>At S40 Fietsservice, Singel 40 in Nijkerk, set-up and bike fit are part of the daily work. The team sets bikes up for your body and your goals, advises on buying a new bike and builds new or second-hand bikes to your wishes. The mechanics are cyclists themselves and do not stop when something works, but when it works in every position.</p>
      <h4>What can you bring?</h4>
      <p>Bring your own bike, the shoes you ride in and clothing you feel comfortable in. Think beforehand about what complaints you have, how often and how long you ride and what your goal is. Also say whether you have a race or long ride planned. The clearer your question, the more targeted the set-up.</p>
      <h4>For road bike and gravel too</h4>
      <p>A good set-up matters as much on a road bike as on a gravel bike. Also read <a href="/post/road-bike-specialist-nijkerk.html">what to expect from a road bike specialist</a> and <a href="/post/gravel-bike-service-nijkerk.html">how to get a gravel bike serviced in Nijkerk</a>.</p>
      <h4>Booking an appointment</h4>
      <p>You book via service@s40.nl, by phone on +31 6 26980438 or with the form on the website. Walking in without an appointment is possible too: the workshop is open Tuesday to Friday from 10:00 to 18:00 and on Saturday from 10:00 to 16:00. Prices are on request.</p>
    </article>

    <article>
      <h3><a href="/post/gravel-bike-service-nijkerk.html">Servicing or repairing a gravel bike in Nijkerk: what you need to know</a></h3>
      <time datetime="2026-11-03">3 November 2026</time>
      <p><em>A gravel bike sees more dirt, sand and water than a road bike. Read what to look out for when servicing it and where to go in Nijkerk for maintenance and repair.</em></p>
      <p>On a gravel bike you ride asphalt, gravel, sand and forest paths, sometimes all in one ride. That makes it versatile, but also more prone to wear than a bike that mostly rides on dry asphalt. If you look after your gravel bike well, you enjoy it for longer and stand still less often far from home.</p>
      <h4>Where does a gravel bike wear faster?</h4>
      <p>Sand and mud work their way into the chain, the cogs and the bearings. Water and dirt also load the brakes. If you ride tubeless, the sealant in the tyres dries up over time and must be replaced. The more varied the surface, the more important it is to check regularly instead of waiting for something to go wrong.</p>
      <h4>A small routine between services</h4>
      <p>After a wet or sandy ride, carefully rinse off the worst dirt, without a pressure washer on the bearings, and dry the bike. Clean the chain and lubricate it again. Check the tyre pressure and listen for new noises from the bottom bracket or the head tube. A chain that stays clean and lubricated lasts longer and shifts better.</p>
      <h4>For those who ride long days off-road</h4>
      <p>If you ride long tours on varied terrain or start gravel races, you need a bike that does not let you down far from home. You want a workshop that understands what such a day asks of your bike and that takes a strange noise seriously, not only what is on the list.</p>
      <p>At S40 Fietsservice, Singel 40 in Nijkerk, cyclists service and repair gravel bikes, just like road bikes, track bikes, BMX bikes and triathlon bikes. The team looks at the whole bike and also takes on jobs that other workshops turn down. For chains, S40 stocks Izumi and is a dealer of CyclOn, known for bike care. The usual turnaround is 24 hours.</p>
      <h4>Maintenance, repair or something special</h4>
      <p>You can go to S40 Fietsservice for all work: maintenance, repair, parts and accessories, and a custom build. A good set-up also helps on long days: read <a href="/post/bike-fit-nijkerk.html">what a bike fit is and when you need one</a>. Do you also ride on the road? Then this <a href="/post/road-bike-specialist-nijkerk.html">road bike specialist in Nijkerk</a> is the place for your road bike too.</p>
      <h4>Dropping by or booking an appointment</h4>
      <p>Walk in during opening hours: Tuesday to Friday from 10:00 to 18:00, Saturday from 10:00 to 16:00. For a bigger job an appointment helps, via service@s40.nl or +31 6 26980438. Prices are on request, because every bike and every job is different.</p>
    </article>

    <article>
      <h3><a href="/post/road-bike-specialist-nijkerk.html">Road bike specialist in Nijkerk: where your bike is in good hands</a></h3>
      <time datetime="2026-11-03">3 November 2026</time>
      <p><em>If you own a road bike in or around Nijkerk, you want a workshop that understands what you ask of your bike. This is what to expect from a road bike specialist who races himself and has worked in UCI teams.</em></p>
      <p>A road bike is not an ordinary bike. A gear that does not quite shift in one position, a saddle a fraction too high or a cable that does not run freely: you feel it on every ride, and in a race it can make the difference. That is why many cyclists in Nijkerk and the surrounding area look not just for a bike shop, but for a road bike specialist.</p>
      <h4>What makes a road bike specialist different?</h4>
      <p>A good road bike specialist does not only look at what is broken, but at how the bike works as a whole: drivetrain, brakes, wheels, position and the way you ride. The difference lies in experience with exactly this kind of bike and in the will to keep going until it is right.</p>
      <h4>For those who train or race seriously</h4>
      <p>If you ride kilometres every week, ride with a club or start races, you want your bike to do the same thing every time. You do not want to find out in the middle of a descent that something is wrong, and you want a workshop that understands you have a date for a race.</p>
      <p>At S40 Fietsservice, Singel 40, that is daily practice. The cyclists behind the workbench have more than twenty years of experience in Europe, from amateur to professional, worked as mechanics in UCI teams and prepare bikes to UCI rules. They do not stop when the gears shift, but when they work perfectly in every position. And because they ride themselves, they understand why your bike has to be ready on time.</p>
      <h4>A problem nobody solves?</h4>
      <p>Sometimes a bike has a problem that several workshops fail to solve. S40 Fietsservice takes on such jobs. The time the team spends investigating the problem and looking for the best solution is not charged. In a Google review, a customer writes that other shops could not fix it and that at S40 it was repaired straight away and fast.</p>
      <h4>What can you have done?</h4>
      <p>You can go to S40 Fietsservice for maintenance and repair, race preparation, parts and accessories, and a custom bike, new or second-hand. Set-up and bike fit are part of it too: read <a href="/post/bike-fit-nijkerk.html">what a bike fit is</a>. Besides road bikes, the team works on gravel bikes, track bikes, BMX bikes and triathlon bikes. For gravel bike maintenance, <a href="/post/gravel-bike-service-nijkerk.html">read on here</a>. The usual turnaround is 24 hours.</p>
      <h4>With or without an appointment</h4>
      <p>You can walk in without an appointment: the workshop is open Tuesday to Friday from 10:00 to 18:00 and on Saturday from 10:00 to 16:00. For a bigger job or a race coming up, an appointment helps. Email service@s40.nl, call +31 6 26980438 or use the form on the website. Prices are on request.</p>
